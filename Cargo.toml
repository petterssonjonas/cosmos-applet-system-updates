[package]
name = "cosmos-applet-system-updates"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0 AND CC-BY-SA-4.0"
description = "Cosmos System Updates applet for the COSMIC panel"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", default-features = false, features = ["applet", "a11y", "dbus-config"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "process", "sync", "time", "rt-multi-thread"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
